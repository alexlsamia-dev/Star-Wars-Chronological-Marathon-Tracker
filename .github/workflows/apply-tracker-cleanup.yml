name: Apply tracker cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-tracker-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove non-story and franchise-crossover entries
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'data/entries.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));
          const before = data.entries.length;
          const removed = data.entries.filter((entry) =>
            (entry.era === 'Review & decide — crossover / alternate universe' && !/Karate Jedi/i.test(entry.title)) ||
            entry.id === '0686d4cb9e4d88' ||
            entry.era === 'Review & decide — promotional / non-story' ||
            entry.era === 'Review & decide — presentation / no timeline'
          );
          if (removed.length !== 27 && removed.length !== 0) {
            throw new Error(`Expected 27 removals or an already-clean tracker; found ${removed.length}`);
          }
          let entries = data.entries.filter((entry) => !removed.some((candidate) => candidate.id === entry.id));
          const current212 = entries.findIndex((entry) => entry.id === 'd61d1117a3bb54');
          if (current212 < 0) throw new Error('The 212th entry is missing');
          const [the212] = entries.splice(current212, 1);
          Object.assign(the212, {
            era: 'Fall of the Jedi',
            seasonEpisode: 'Estimated: late Clone Wars',
            notes: 'Fan-made / non-canon. Commander Cody and the 212th face General Grievous. Best-fit placement: late in the Clone Wars, after Phase II clone armor is in use and before Revenge of the Sith. The filmmakers do not identify the exact mission date, so this placement remains estimated.',
            chronologicalPlacement: 'Late Clone Wars (estimated) — before Revenge of the Sith; exact mission date is not stated',
            verificationStatus: 'Verified from screenshot and official Hoplite project/upload; chronological placement is estimated',
            placementConfidence: 'Medium',
            reviewReasons: 'Exact mission date is not stated; late-Clone-Wars placement is inferred from Commander Cody, the 212th, General Grievous, and Phase II-era presentation.'
          });
          const anchor = entries.findIndex((entry) => entry.title === 'Tales of the Jedi: Practice Makes Perfect');
          if (anchor < 0) throw new Error('Practice Makes Perfect anchor is missing');
          entries.splice(anchor, 0, the212);
          data.entries = entries;
          data.total = entries.length;
          if (data.intake && Object.prototype.hasOwnProperty.call(data.intake, 'final_checklist_entries')) {
            data.intake.final_checklist_entries = entries.length;
          }
          if (entries.length !== 922) throw new Error(`Expected 922 entries; found ${entries.length}`);
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n');
          const indexPath = 'index.html';
          const index = fs.readFileSync(indexPath, 'utf8').replace(
            '949 entries · 591 source screenshots · 575 unique screenshot videos.',
            '922 entries · 591 source screenshots · 575 unique screenshot videos.'
          );
          fs.writeFileSync(indexPath, index);
          console.log(`Tracker cleaned: ${before} -> ${entries.length}`);
          NODE
      - name: Commit cleanup
        run: |
          if git diff --quiet -- data/entries.json index.html; then
            echo "Tracker already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/entries.json index.html
          git commit -m "Remove crossovers and non-story uploads"
          git push
